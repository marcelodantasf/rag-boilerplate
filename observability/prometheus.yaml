global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment_environment: local

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
