[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rag-boilerplate-core-api"
version = "0.1.0"
description = "Provider-neutral RAG Core API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "opentelemetry-api==1.37.0",
  "opentelemetry-exporter-otlp-proto-http==1.37.0",
  "opentelemetry-instrumentation-fastapi==0.58b0",
  "opentelemetry-sdk==1.37.0",
  "pydantic==2.11.7",
  "qdrant-client==1.15.1",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
core-rag-api = "rag_core.__main__:main"

[project.optional-dependencies]
test = [
  "pyyaml==6.0.3",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires an externally running dependency",
  "e2e: requires the Compose application stack",
]
